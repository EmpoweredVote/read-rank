services:
  - type: web
    name: read-rank-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Client-side routing: react-router owns /race/:id/:step, so any path the
    # static host can't resolve to a file must serve the app shell and let the
    # router take over. Without this, a mid-race refresh or a shared race link
    # 404s at the CDN and never reaches useRaceRouteSync. Existing files still
    # win, so /assets/* is unaffected.
    #
    # NOTE: this only takes effect if the Render service is managed by a synced
    # Blueprint. A service created by hand in the dashboard ignores render.yaml
    # entirely — set the same rule under Redirects/Rewrites there.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The races/quotes/reveal API. Must match what the deployed dashboard value
      # actually is — the shipped bundle calls https://api.empowered.vote/api/...,
      # and this file said accounts-api, which would have silently repointed the
      # app at the wrong host the moment anyone Blueprint-linked this service.
      #
      # Not the auth host: API_HUB_URL in src/lib/auth.ts is hardcoded to
      # accounts-api.empowered.vote and does not read this variable.
      - key: VITE_API_URL
        value: https://api.empowered.vote
      - key: NPM_TOKEN
        sync: false
