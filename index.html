<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/read-and-rank-favicon-light-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/read-and-rank-favicon-light-16.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/read-and-rank-favicon-dark-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/read-and-rank-favicon-dark-16.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/read-and-rank-favicon-light-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read &amp; Rank — Empowered Vote</title>
    <meta name="description" content="Read candidate answers with the names hidden, then rank them by how well they match your own views. Judge candidates on substance, not labels." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Empowered Vote" />
    <meta property="og:title" content="Read &amp; Rank — Empowered Vote" />
    <meta property="og:description" content="Read candidate answers with the names hidden, then rank them by how well they match your own views. Judge candidates on substance, not labels." />
    <meta property="og:url" content="https://readrank.empowered.vote/" />
    <meta property="og:image" content="https://readrank.empowered.vote/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Resolve the theme before first paint, in the same order as ThemeProvider. Without this
      // the class was only applied once React mounted, so every load flashed the wrong theme.
      // The ev_theme cookie is the cross-app truth (.empowered.vote) and is read first, or the
      // first paint ignores the choice the visitor made in the app they arrived from.
      //
      // Dark is the default and the OS is never consulted: a browser reports
      // prefers-color-scheme: light when the OS has no preference set at all, so reading it
      // could not tell "never chose" apart from "chose light", and every undecided visitor
      // got a light page. Only a choice made on an Empowered Vote site counts.
      (function () {
        var m = document.cookie.match(/(?:^|;\s*)ev_theme=([^;]+)/);
        var s = m ? m[1] : null;
        try {
          if (!s) {
            s = localStorage.getItem('ev:color-scheme');
            if (!s) {
              var legacy = localStorage.getItem('compass_dark_mode');
              if (legacy !== null) s = legacy === 'true' ? 'dark' : 'light';
            }
            if (s) {
              var d = new Date();
              d.setFullYear(d.getFullYear() + 1);
              document.cookie = 'ev_theme=' + s + '; domain=.empowered.vote; path=/; expires=' + d.toUTCString() + '; SameSite=Lax';
            }
          }
        } catch (err) { /* best-effort: storage is unavailable, fall through to the dark default */ }
        if (s !== 'light') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
